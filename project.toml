[project]
name = "zlib370"
version = "1.0.0-dev"
type = "library"

[build]
cflags = [
	"-DZ_SOLO",
	"-DNOCRYPT",
	"-DUSE_FILE32API",
	"-DNO_ADDFILEINEXISTINGZIP",
	"-I./include",
]

[mvs.build.datasets.source]
suffix = "SOURCE"
dsorg = "PO"
recfm = "FB"
lrecl = 80
blksize = 19040
space = ["TRK", 100, 50, 30]

[mvs.build.datasets.punch]
suffix = "OBJECT"
dsorg = "PO"
recfm = "FB"
lrecl = 80
blksize = 19040
space = ["TRK", 50, 20, 30]

[mvs.build.datasets.ncalib]
suffix = "NCALIB"
dsorg = "PO"
recfm = "U"
lrecl = 0
blksize = 19069
space = ["TRK", 50, 20, 30]

[dependencies]
"mvslovers/crent370" = ">=1.0.4"

[artifacts]
mvs = true
headers = true

[release]
version_files = ["VERSION"]
