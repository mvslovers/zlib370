schema = 3

[project]
name = "zlib370"
version = "1.0.0-dev"
kind = "library"

[toolchain]
mbt = "3.0"
cc370 = "1.6.1"
libc370 = "2.10.0"

[build]
cflags = ["-DZ_SOLO"]

[lib]
name = "zlib370"
sources = ["src/*.c"]
headers = ["include/zlib.h", "include/zconf.h"]

[tests]
rent = false
reus = false

# A test is built from its own file only; this one exercises the whole
# library, so it links every source module.
[test.TSTZLIB]
sources = ["test/tstzlib.c", "src/*.c"]

