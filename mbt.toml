schema = 3

[project]
name = "zlib370"
version = "1.0.0-dev"
kind = "library"

[toolchain]
mbt = "3.0"
cc370 = "1.6.1"
libc370 = "2.10.0"

[build]
cflags = [
  "-DZ_SOLO",
  "-DNOCRYPT",
  "-DUSE_FILE32API",
  "-DNO_ADDFILEINEXISTINGZIP",
]

[lib]
name = "zlib370"
sources = ["src/*.c"]
headers = [
  "include/zlib.h",
  "include/zconf.h",
  "include/ioapi.h",
  "include/unzip.h",
  "include/zip.h",
]

[tests]
rent = false
reus = false

# A test is built from its own file only; this one runs the zlib core
# (the ZIP sources are left out), so it links those modules.
[test.TSTZLIB]
sources = [
  "test/tstzlib.c",
  "src/adler32.c",
  "src/compress.c",
  "src/crc32.c",
  "src/deflate.c",
  "src/inffast.c",
  "src/inflate.c",
  "src/inftrees.c",
  "src/trees.c",
  "src/uncompr.c",
  "src/zutil.c",
]
